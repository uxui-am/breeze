<script>
/* desktop: календарь над строкой поиска с зазором 40px (как в Figma), но не выше 80px от верха */
(function(){const place=()=>{if(innerWidth<=900)return;document.querySelectorAll('.cal-pop:not(.apt-calendar-centered)').forEach(el=>{if(!el.matches(':popover-open'))return;const a=el.parentElement.getBoundingClientRect();const top=Math.max(80,Math.round(a.top-40-el.offsetHeight));el.style.setProperty('--brz-cal-top',top+'px');});const sr=document.querySelector('#search');document.querySelectorAll('.pop-up.res:not(.footer-dialog)').forEach(el=>{if(!sr||el.matches(':popover-open'))return;const want=sr.getBoundingClientRect().top-40;const hd=document.querySelector('#top header');const lim=(hd?hd.getBoundingClientRect().bottom:0)+16;el.style.setProperty('translate','none','important');el.style.setProperty('top','auto','important');let r=el.getBoundingClientRect();if(!r.height)return;const sc=r.width/el.offsetWidth||1;el.style.setProperty('max-height',Math.round((innerHeight-16-lim)/sc)+'px','important');const need=el.scrollHeight*sc;const tgt=Math.min(innerHeight-16,Math.max(want,lim+need));r=el.getBoundingClientRect();const d=(tgt-r.bottom)/sc;if(Math.abs(d)<1)return;const cb=parseFloat(getComputedStyle(el).bottom)||0;el.style.setProperty('bottom',Math.round(cb-d)+'px','important');});};
new MutationObserver(()=>requestAnimationFrame(place)).observe(document.documentElement,{childList:true,subtree:true});addEventListener('resize',place);})();
</script>

 const oceanScript=document.querySelector('script[type="text/x-dc"]');oceanScript.textContent="class Component extends DCLogic {\n renderVals(){return {};}\n componentDidMount(){\n const $=s=>document.querySelector(s),$$=s=>Array.from(document.querySelectorAll(s));\n const translations={\n 'Забронировать':['Book','Reservar'],'Апартаменты ▾':['Apartments ▾','Apartamentos ▾'],'Локация':['Location','Ubicación'],'Вопросы':['Questions','Preguntas'],'Главная':['Home','Inicio'],'Апартаменты':['Apartments','Apartamentos'],\n '☀ Солнце весь день':['☀ Sunshine all day','☀ Sol todo el día'],\n '65 м² · 1 спальня · 1 ванная · до 4 гостей · Balcón de Los Gigantes':['65 m² · 1 bedroom · 1 bathroom · up to 4 guests · Balcón de Los Gigantes','65 m² · 1 dormitorio · 1 baño · hasta 4 huéspedes · Balcón de Los Gigantes'],\n '· Booking · 74 отзыва':['· Booking · 74 reviews','· Booking · 74 opiniones'],'Все фото · 5':['All photos · 5','Todas las fotos · 5'],\n 'Светлый апартамент с солнцем весь день':['A bright apartment with sunshine all day','Un apartamento luminoso con sol todo el día'],\n 'Окна и терраса выходят на юг, поэтому солнце здесь с утра до вечера. С террасы видно бассейн комплекса, до океана — несколько минут пешком. Внутри — гостиная с диваном-кроватью, спальня с кроватью king-size, полностью оборудованная кухня и ванная с душем.':['The windows and terrace face south, bringing sunshine from morning to evening. The terrace overlooks the shared pool, and the ocean is a short walk away. Inside you will find a living room with a sofa bed, a bedroom with a king-size bed, a fully equipped kitchen and a bathroom with a shower.','Las ventanas y la terraza dan al sur y reciben sol desde la mañana hasta la tarde. La terraza tiene vistas a la piscina del complejo y el océano está a pocos minutos a pie. Dentro hay un salón con sofá cama, un dormitorio con cama king-size, cocina totalmente equipada y baño con ducha.'],\n 'Что внутри':['Amenities','Equipamiento'],'Кровать king-size + диван-кровать':['King-size bed + sofa bed','Cama king-size + sofá cama'],'Полностью оборудованная кухня':['Fully equipped kitchen','Cocina totalmente equipada'],'Терраса с двумя лежаками':['Terrace with two sun loungers','Terraza con dos tumbonas'],'Вид на бассейн комплекса':['Views of the shared pool','Vistas a la piscina del complejo'],'Быстрый Wi-Fi':['Fast Wi-Fi','Wi-Fi rápido'],'Кондиционер':['Air conditioning','Aire acondicionado'],'Стиральная машина':['Washing machine','Lavadora'],'Условия':['House rules','Condiciones'],'Заезд / выезд':['Check-in / check-out','Entrada / salida'],'с 15:00 / до 11:00':['from 15:00 / before 11:00','desde las 15:00 / hasta las 11:00'],'Отмена':['Cancellation','Cancelación'],'Бесплатно до 4 дней до заезда':['Free until 4 days before arrival','Gratis hasta 4 días antes de la llegada'],'Залог':['Deposit','Fianza'],'150 €, возвращаем в день выезда':['€150, refunded on departure','150 €, se devuelve el día de salida'],'Гости':['Guests','Huéspedes'],'До 4 человек · можно с детьми':['Up to 4 guests · children welcome','Hasta 4 personas · se admiten niños'],'Расположение':['Location','Ubicación'],'Отзывы об Ocean Breeze':['Ocean Breeze reviews','Opiniones de Ocean Breeze'],'Все 74 отзыва ↗':['All 74 reviews ↗','Las 74 opiniones ↗'],\n '«[Цитата из настоящего отзыва об Ocean Breeze — из анкеты]»':['“[Real Ocean Breeze review quote — from the questionnaire]”','«[Cita de una opinión real de Ocean Breeze — del cuestionario]»'],'[Имя], [страна] · [месяц] · Booking':['[Name], [country] · [month] · Booking','[Nombre], [país] · [mes] · Booking'],'[Имя], [страна] · [месяц] · Airbnb':['[Name], [country] · [month] · Airbnb','[Nombre], [país] · [mes] · Airbnb'],'/ ночь':['/ night','/ noche'],'Заезд':['Check-in','Entrada'],'Выезд':['Check-out','Salida'],'Забронировать напрямую':['Book directly','Reservar directamente'],'Оплата не списывается до подтверждения':['No payment until confirmation','No se cobra hasta la confirmación'],'Уборка':['Cleaning','Limpieza'],'Итого':['Total','Total'],'Написать Анастасии в WhatsApp':['Message Anastasia on WhatsApp','Escribir a Anastasia por WhatsApp'],'Другие апартаменты':['Other apartments','Otros apartamentos'],'82 м² · 1 спальня · свежесть и тень':['82 m² · 1 bedroom · cool and shaded','82 m² · 1 dormitorio · frescor y sombra'],'98 м² · 2 спальни · закаты':['98 m² · 2 bedrooms · sunsets','98 m² · 2 dormitorios · atardeceres'],'от 105 €':['from €105','desde 105 €'],'от 140 €':['from €140','desde 140 €'],'Запрос на бронирование':['Booking enquiry','Solicitud de reserva'],'Это предварительный расчёт. Анастасия подтвердит доступность и стоимость лично.':['This is an estimate. Anastasia will personally confirm availability and price.','Este es un presupuesto orientativo. Anastasia confirmará personalmente la disponibilidad y el precio.'],'Обсудить в WhatsApp':['Discuss on WhatsApp','Consultar por WhatsApp']\n };\n Object.assign(translations,{\"«Очень тихий комплекс, бассейн прямо под окнами. Парковка внизу выручила, хотя въезд узковат.»\": [\"“A very quiet complex, with the pool right below the windows. The parking downstairs was useful, although the entrance is narrow.”\", \"«Un complejo muy tranquilo, con la piscina bajo las ventanas. El aparcamiento de abajo fue útil, aunque la entrada es estrecha.»\"], \"Великобритания\": [\"United Kingdom\", \"Reino Unido\"], \"«Жили месяц зимой. Солнце весь день, быстрый Wi-Fi. Посуды для долгой готовки маловато, но в целом отлично.»\": [\"“We stayed for a month in winter. Sunshine all day, fast Wi-Fi. A little short on cookware for long stays, but great overall.”\", \"«Pasamos un mes en invierno. Sol todo el día y wifi rápido. Faltan algunos utensilios para estancias largas, pero en general excelente.»\"], \"Польша\": [\"Poland\", \"Polonia\"], \"Андрей\": [\"Andrei\", \"Andrei\"], \"Апартаменты\": [\"Apartments\", \"Apartamentos\"], \"Особые условия\": [\"Special stays\", \"Estancias especiales\"], \"Забронировать\": [\"Book\", \"Reservar\"], \"Все 74 отзыва\": [\"All 74 reviews\", \"Las 74 opiniones\"], \"Сбросить\": [\"Clear\", \"Borrar\"], \"Готово\": [\"Done\", \"Listo\"], \"82 м²\": [\"82 m²\", \"82 m²\"], \"98 м²\": [\"98 m²\", \"98 m²\"], \"1 спальня\": [\"1 bedroom\", \"1 dormitorio\"], \"2 спальни\": [\"2 bedrooms\", \"2 dormitorios\"], \"1 ванная\": [\"1 bathroom\", \"1 baño\"], \"2 ванные\": [\"2 bathrooms\", \"2 baños\"]});\n Object.assign(translations,{'Все 74 отзыва →':['All 74 reviews →','Las 74 opiniones →']});Object.assign(translations,{\"«Приезжаем второй год подряд. Терраса, солнце с утра до вечера и океан в пяти минутах — лучше места на юге не нашли.»\": [\"“Our second year here. A terrace, sunshine all day and the ocean five minutes away — we haven’t found a better place in the south.”\", \"«Volvemos por segundo año. Terraza, sol todo el día y el océano a cinco minutos: no hemos encontrado un lugar mejor en el sur.»\"], \"Испания · Atlantic Breeze\": [\"Spain · Atlantic Breeze\", \"España · Atlantic Breeze\"]});Object.assign(translations,{\"Wi-Fi 100 Мбит/⁠с\": [\"Wi-Fi 100 Mbps\", \"Wi-Fi 100 Mbps\"], \"Smart TV\": [\"Smart TV\", \"Smart TV\"], \"Кондиционер\": [\"Air con\", \"Aire acond.\"], \"Кофемашина\": [\"Coffee machine\", \"Cafetera\"], \"Посудомойка\": [\"Dishwasher\", \"Lavavajillas\"], \"Стиральная машина\": [\"Washer & dryer\", \"Lavadora\"], \"Бельё и полотенца\": [\"Linen & towels\", \"Ropa y toallas\"], \"Детская кроватка\": [\"Baby cot\", \"Cuna\"]});Object.assign(translations,{\"Отзывы\": [\"Reviews\", \"Opiniones\"], \"Контакты\": [\"Contacts\", \"Contacto\"], \"Сайт\": [\"Site\", \"Sitio\"], \"Вопросы\": [\"FAQ\", \"Preguntas\"], \"Страницы\": [\"Pages\", \"Páginas\"], \"Номер регистрации: VV-38-4-0098765\": [\"Registration no.: VV-38-4-0098765\", \"N.º de registro: VV-38-4-0098765\"], \"Апартаменты\": [\"Apartments\", \"Apartamentos\"], \"Локация\": [\"Location\", \"Ubicación\"], \"Особые условия\": [\"Special stays\", \"Estancias especiales\"], \"Политика конфиденциальности\": [\"Privacy policy\", \"Política de privacidad\"]});let lang=0;const locales=['ru-RU','en-GB','es-ES'];\n const textNodes=[];const walker=document.createTreeWalker($('#dc-root'),NodeFilter.SHOW_TEXT);let node;\n while(node=walker.nextNode()){const original=node.textContent.trim();if(translations[original])textNodes.push({node,original,prefix:node.textContent.match(/^\\s*/)[0],suffix:node.textContent.match(/\\s*$/)[0]});}\n const paths=['M3 18v-6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v6M3 18h18M3 14h18M7 10V7a1 1 0 0 1 1-1h3a1 1 0 0 1 1 1v3','M4 3v6c0 3 6 3 6 0V3M7 3v18M17 3v18M17 3c5 3 5 9 0 9','M12 3v2m0 14v2M3 12h2m14 0h2M5 5l2 2m10 10 2 2M5 19l2-2M17 7l2-2M16 12a4 4 0 11-8 0 4 4 0 018 0','M3 17c3-3 5 3 8 0s5 3 10 0M3 21c3-3 5 3 8 0s5 3 10 0M7 14V5a2 2 0 014 0M14 14V5a2 2 0 014 0M7 8h7M7 12h7','M3 8a15 15 0 0118 0M6 12a10 10 0 0112 0M9 16a5 5 0 016 0M12 20h.01','M12 2v20M3 7l18 10M3 17L21 7M9 4l3 3 3-3M9 20l3-3 3 3','M4 3h16v18H4zM7 6h1M11 6h6M17 14a5 5 0 11-10 0 5 5 0 0110 0','M3 5h18v13H3zM8 22h8M12 18v4'];\n const homeAmenityIcons={\"4\": \"<svg width=\\\"18\\\" height=\\\"18\\\" viewBox=\\\"0 0 24 24\\\" fill=\\\"none\\\" stroke=\\\"currentColor\\\" stroke-width=\\\"1.4\\\" stroke-linecap=\\\"round\\\" stroke-linejoin=\\\"round\\\"><path d=\\\"M2 9a15 15 0 0 1 20 0M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0\\\"></path><circle cx=\\\"12\\\" cy=\\\"19.5\\\" r=\\\"1\\\"></circle></svg>\", \"7\": \"<svg width=\\\"18\\\" height=\\\"18\\\" viewBox=\\\"0 0 24 24\\\" fill=\\\"none\\\" stroke=\\\"currentColor\\\" stroke-width=\\\"1.4\\\" stroke-linecap=\\\"round\\\" stroke-linejoin=\\\"round\\\"><rect x=\\\"3\\\" y=\\\"5\\\" width=\\\"18\\\" height=\\\"12\\\" rx=\\\"2\\\"></rect><path d=\\\"M8 21h8M12 17v4\\\"></path></svg>\", \"5\": \"<svg width=\\\"18\\\" height=\\\"18\\\" viewBox=\\\"0 0 24 24\\\" fill=\\\"none\\\" stroke=\\\"currentColor\\\" stroke-width=\\\"1.4\\\" stroke-linecap=\\\"round\\\" stroke-linejoin=\\\"round\\\"><path d=\\\"M3 6h18v6H3zM6 1 abel','Ocean Breeze '+(i+1));const thumb=document.createElement('img');thumb.src=img.src;thumb.alt='';b.append(thumb);b.onclick=()=>showPhoto(i);$('#ocean-gallery-thumbs').append(b);});\n images.forEach((img,i)=>{img.tabIndex=0;img.addEventListener('click',()=>{showPhoto(i);gallery.showModal();});img.addEventListener('keydown',e=>{if(e.key==='Enter'){showPhoto(i);gallery.showModal();}});});\n \n $('[data-next]').onclick=()=>showPhoto(photo+1);$('[data-prev]').onclick=()=>showPhoto(photo-1);\n gallery.addEventListener('keydown',e=>{if(e.key==='ArrowRight')showPhoto(photo+1);if(e.key==='ArrowLeft')showPhoto(photo-1);});\n $$('[data-close]').forEach(b=>b.onclick=()=>b.closest('dialog').close());$$('dialog').forEach(d=>d.addEventListener('click',e=>{if(e.target===d){const r=d.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)d.close();}}));\n  const calendar=$('#ocean-calendar');let calMonth=new Date();calMonth=new Date(calMonth.getFullYear(),calMonth.getMonth(),1);let choosingEnd=false;\n const fmtDate=v=>v?new Date(v+'T12:00:00').toLocaleDateString(locales[lang],{day:'numeric',month:'short'}):['Выбрать дату','Select date','Elegir fecha'][lang];\n function updateDateLabels(){for(const f of ['in','out'])$('#ocean-'+f+'-trigger').textContent=$('#ocean-'+f).value?fmtDate($('#ocean-'+f).value):(f==='in'?['Заезд','Check-in','Llegada'][lang]:['Выезд','Check-out','Salida'][lang]);}\n function renderCalendar(){\n const ci=$('#ocean-in').value,co=$('#ocean-out').value;$('#ocean-cal-hint').textContent=choosingEnd?['Выберите дату выезда','Choose check-out','Elige la salida'][lang]:['Выберите даты поездки','Choose your dates','Elige tus fechas'][lang];\n const holder=$('#ocean-cal-months');holder.replaceChildren();const now=new Date();now.setHours(0,0,0,0);$('#ocean-cal-prev').disabled=calMonth<=new Date(now.getFullYear(),now.getMonth(),1);\n for(let m=0;m<2;m++){const date=new Date(calMonth.getFullYear(),calMonth.getMonth()+m,1);const month=document.createElement('div');month.className='ocean-cal-month';const title=document.createElement('h3');title.textContent=date.toLocaleDateString(locales[lang],{month:'long',year:'numeric'});month.append(title);const week=document.createElement('div');week.className='ocean-cal-week';for(let d=0;d<7;d++){const el=document.createElement('span');el.textContent=new Date(2026,0,5+d).toLocaleDateString(locales[lang],{weekday:'short'});week.append(el);}month.append(week);const grid=document.createElement('div');grid.className='ocean-cal-grid';const offset=(date.getDay()+6)%7;for(let blank=0;blank<offset;blank++)grid.append(document.createElement('span'));const days=new Date(date.getFullYear(),date.getMonth()+1,0).getDate();\n for(let day=1;day<=days;day++){const dt=new Date(date.getFullYear(),date.getMonth(),day);const value=dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(day).padStart(2,'0');const b=document.createElement('button');b.type='button';b.textContent=day;b.disabled=dt<now;b.setAttribute('aria-label',dt.toLocaleDateString(locales[lang],{day:'numeric',month:'long',year:'numeric'}));b.setAttribute('aria-pressed',String(value===ci||value===co));if(value===ci||value===co)b.classList.add('selected');else if(ci&&co&&value>ci&&value<co)b.classList.add('in-range');b.onclick=()=>{if(!choosingEnd||!ci||value<=ci){$('#ocean-in').value=value;$('#ocean-out').value='';oceanChecked=false;updateQuoteState();choosingEnd=true;}else{$('#ocean-out').value=value;choosingEnd=false;oceanChecked=false;calc();}updateDateLabels();renderCalendar();};grid.append(b);}month.append(grid);holder.append(month);}\n $('#ocean-cal-range').textContent=fmtDate(ci)+' — '+fmtDate(co);$('#ocean-cal-done').textContent=['Готово','Done','Listo'][lang];$('#ocean-cal-clear').textContent=['Сбросить','Clear','Borrar'][lang];$('#ocean-cal-done').disabled=!(ci&&co);\n }\n for(const f of ['in','out'])$('#ocean-'+f+'-trigger').onclick=()=>{choosingEnd=f==='out';const value=$('#
